<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">

  <!-- 外圈：纯圆，留 2px 安全边距，防止小尺寸裁切 -->
  <circle cx="32" cy="32" r="30" fill="#0B1320"></circle>

  <!-- HL 字母：专为 favicon 调整的比例与字距 -->
  <text x="32" y="34" text-anchor="middle" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                     'Segoe UI', Roboto, Helvetica, Arial" font-size="26" font-weight="800" letter-spacing="1.2" fill="#FFFFFF">
    HL
  </text>

</svg>
